name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@textfilters"
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Check all workspaces
        run: npm run check

      - name: Validate released package paths
        env:
          RELEASED_PATHS: ${{ needs.release-please.outputs.paths_released }}
        run: node scripts/publish-released-workspaces.mjs --validate-only

      - name: Publish released packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASED_PATHS: ${{ needs.release-please.outputs.paths_released }}
        run: node scripts/publish-released-workspaces.mjs
